<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <filter id="exprDashGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="miniScreen" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stopColor="#0a0f1d" />
      <stop offset="85%" stopColor="#020617" />
      <stop offset="100%" stopColor="#000000" />
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="#040810" rx="16" />
  <text x="300" y="40" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" fill="#00FF66" letter-spacing="2">DASH — FACE EXPRESSIONS (EXPRESSION ENGINE)</text>

  <!-- Row 1 -->
  <!-- 1. Happy -->
  <g transform="translate(40, 70)">
    <rect x="15" y="20" width="110" height="85" rx="28" fill="url(#miniScreen)" stroke="#1e293b" strokeWidth="2" />
    <g filter="url(#exprDashGlow)">
      <path d="M 40,62 Q 52,45 64,62" fill="none" stroke="#00FF66" strokeWidth="4.5" strokeLinecap="round" />
      <path d="M 76,62 Q 88,45 100,62" fill="none" stroke="#00FF66" strokeWidth="4.5" strokeLinecap="round" />
      <path d="M 64,74 Q 70,79 76,74" fill="none" stroke="#00FF66" strokeWidth="2.5" strokeLinecap="round" />
    </g>
    <text x="70" y="135" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Happy</text>
  </g>

  <!-- 2. Winking -->
  <g transform="translate(230, 70)">
    <rect x="15" y="20" width="110" height="85" rx="28" fill="url(#miniScreen)" stroke="#1e293b" strokeWidth="2" />
    <g filter="url(#exprDashGlow)">
      <path d="M 40,62 Q 52,45 64,62" fill="none" stroke="#00FF66" strokeWidth="4.5" strokeLinecap="round" />
      <path d="M 76,55 L 88,62 L 100,55" fill="none" stroke="#00FF66" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round" />
      <path d="M 64,74 Q 70,79 76,74" fill="none" stroke="#00FF66" strokeWidth="2.5" strokeLinecap="round" />
    </g>
    <text x="70" y="135" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Winking</text>
  </g>

  <!-- 3. Excited -->
  <g transform="translate(420, 70)">
    <rect x="15" y="20" width="110" height="85" rx="28" fill="url(#miniScreen)" stroke="#1e293b" strokeWidth="2" />
    <g filter="url(#exprDashGlow)">
      <path d="M 38,62 Q 52,42 66,62" fill="none" stroke="#00FF66" strokeWidth="5" strokeLinecap="round" />
      <path d="M 74,62 Q 88,42 102,62" fill="none" stroke="#00FF66" strokeWidth="5" strokeLinecap="round" />
      <path d="M 62,72 Q 70,82 78,72 Z" fill="#00FF66" />
    </g>
    <text x="70" y="135" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Excited</text>
  </g>

  <!-- Row 2 -->
  <!-- 4. Focused -->
  <g transform="translate(40, 230)">
    <rect x="15" y="20" width="110" height="85" rx="28" fill="url(#miniScreen)" stroke="#1e293b" strokeWidth="2" />
    <g filter="url(#exprDashGlow)">
      <line x1="40" y1="54" x2="64" y2="64" stroke="#00FF66" strokeWidth="4.5" strokeLinecap="round" />
      <line x1="100" y1="54" x2="76" y2="64" stroke="#00FF66" strokeWidth="4.5" strokeLinecap="round" />
      <circle cx="56" cy="65" r="3" fill="#ffffff" />
      <circle cx="84" cy="65" r="3" fill="#ffffff" />
      <line x1="66" y1="74" x2="74" y2="74" stroke="#00FF66" strokeWidth="2" strokeLinecap="round" />
    </g>
    <text x="70" y="135" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Focused</text>
  </g>

  <!-- 5. Scanning -->
  <g transform="translate(230, 230)">
    <rect x="15" y="20" width="110" height="85" rx="28" fill="url(#miniScreen)" stroke="#1e293b" strokeWidth="2" />
    <g filter="url(#exprDashGlow)">
      <circle cx="52" cy="60" r="9" fill="none" stroke="#00FF66" strokeWidth="2.5" strokeDasharray="10 4" />
      <circle cx="88" cy="60" r="9" fill="none" stroke="#00FF66" strokeWidth="2.5" strokeDasharray="10 4" />
      <line x1="52" y1="52" x2="52" y2="68" stroke="#00FF66" strokeWidth="1.5" />
      <line x1="44" y1="60" x2="60" y2="60" stroke="#00FF66" strokeWidth="1.5" />
      <line x1="88" y1="52" x2="88" y2="68" stroke="#00FF66" strokeWidth="1.5" />
      <line x1="80" y1="60" x2="96" y2="60" stroke="#00FF66" strokeWidth="1.5" />
    </g>
    <text x="70" y="135" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Scanning</text>
  </g>

  <!-- 6. Confused -->
  <g transform="translate(420, 230)">
    <rect x="15" y="20" width="110" height="85" rx="28" fill="url(#miniScreen)" stroke="#1e293b" strokeWidth="2" />
    <g filter="url(#exprDashGlow)">
      <circle cx="50" cy="58" r="6" fill="#00FF66" />
      <path d="M 76,64 Q 88,50 100,64" fill="none" stroke="#00FF66" strokeWidth="4.5" strokeLinecap="round" />
      <path d="M 64,74 Q 70,70 76,76" fill="none" stroke="#00FF66" strokeWidth="2.5" strokeLinecap="round" />
    </g>
    <text x="70" y="135" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Confused</text>
  </g>

  <!-- Row 3 -->
  <!-- 7. Executing -->
  <g transform="translate(40, 390)">
    <rect x="15" y="20" width="110" height="85" rx="28" fill="url(#miniScreen)" stroke="#1e293b" strokeWidth="2" />
    <g filter="url(#exprDashGlow)">
      <path d="M 44,54 L 54,62 L 44,70" fill="none" stroke="#00FF66" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
      <path d="M 56,54 L 66,62 L 56,70" fill="none" stroke="#00FF66" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
      <path d="M 74,54 L 84,62 L 74,70" fill="none" stroke="#00FF66" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
      <path d="M 86,54 L 96,62 L 86,70" fill="none" stroke="#00FF66" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
    </g>
    <text x="70" y="135" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Executing</text>
  </g>

  <!-- 8. Alert -->
  <g transform="translate(230, 390)">
    <rect x="15" y="20" width="110" height="85" rx="28" fill="url(#miniScreen)" stroke="#1e293b" strokeWidth="2" />
    <g filter="url(#exprDashGlow)">
      <circle cx="52" cy="60" r="10" fill="none" stroke="#00FF66" strokeWidth="3" />
      <text x="52" y="65" text-anchor="middle" fill="#00FF66" font-size="12" font-family="monospace" font-weight="900">!</text>
      <circle cx="88" cy="60" r="10" fill="none" stroke="#00FF66" strokeWidth="3" />
      <text x="88" y="65" text-anchor="middle" fill="#00FF66" font-size="12" font-family="monospace" font-weight="900">!</text>
    </g>
    <text x="70" y="135" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Alert</text>
  </g>

  <!-- 9. Sleep -->
  <g transform="translate(420, 390)">
    <rect x="15" y="20" width="110" height="85" rx="28" fill="url(#miniScreen)" stroke="#1e293b" strokeWidth="2" />
    <g filter="url(#exprDashGlow)">
      <line x1="42" y1="62" x2="64" y2="62" stroke="#00FF66" strokeWidth="4" strokeLinecap="round" />
      <line x1="76" y1="62" x2="98" y2="62" stroke="#00FF66" strokeWidth="4" strokeLinecap="round" />
      <text x="96" y="50" fill="#00FF66" font-size="10" font-family="monospace" font-weight="bold">z</text>
      <text x="104" y="42" fill="#00FF66" font-size="8" font-family="monospace" font-weight="bold">z</text>
    </g>
    <text x="70" y="135" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Sleep</text>
  </g>
</svg>
