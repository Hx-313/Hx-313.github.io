<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <filter id="exprAeroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="miniFace" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stopColor="#0a0f1d" />
      <stop offset="85%" stopColor="#020617" />
      <stop offset="100%" stopColor="#000000" />
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="#040810" rx="16" />
  <text x="300" y="40" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" fill="#00FF66" letter-spacing="2">AERO — FACE EXPRESSIONS (EMOTION ENGINE)</text>

  <!-- Row 1 -->
  <!-- 1. Happy -->
  <g transform="translate(40, 70)">
    <circle cx="70" cy="70" r="55" fill="url(#miniFace)" stroke="#1e293b" strokeWidth="2" />
    <g filter="url(#exprAeroGlow)">
      <path d="M 45,70 Q 55,54 65,70" fill="none" stroke="#00FF66" strokeWidth="4.5" strokeLinecap="round" />
      <path d="M 75,70 Q 85,54 95,70" fill="none" stroke="#00FF66" strokeWidth="4.5" strokeLinecap="round" />
      <path d="M 64,84 Q 70,89 76,84" fill="none" stroke="#00FF66" strokeWidth="2.5" strokeLinecap="round" />
    </g>
    <text x="70" y="145" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Happy</text>
  </g>

  <!-- 2. Thinking -->
  <g transform="translate(230, 70)">
    <circle cx="70" cy="70" r="55" fill="url(#miniFace)" stroke="#1e293b" strokeWidth="2" />
    <g filter="url(#exprAeroGlow)">
      <circle cx="52" cy="70" r="5" fill="#00FF66" />
      <circle cx="82" cy="62" r="6.5" fill="#00FF66" />
      <path d="M 46,58 Q 54,55 60,60" stroke="#00FF66" strokeWidth="2.5" fill="none" />
      <path d="M 74,50 Q 83,47 92,53" stroke="#00FF66" strokeWidth="2.5" fill="none" />
      <circle cx="88" cy="84" r="2" fill="#00FF66" />
      <circle cx="94" cy="78" r="2.5" fill="#00FF66" />
    </g>
    <text x="70" y="145" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Thinking</text>
  </g>

  <!-- 3. Excited -->
  <g transform="translate(420, 70)">
    <circle cx="70" cy="70" r="55" fill="url(#miniFace)" stroke="#1e293b" strokeWidth="2" />
    <g filter="url(#exprAeroGlow)">
      <path d="M 42,70 Q 55,48 68,70" fill="none" stroke="#00FF66" strokeWidth="5" strokeLinecap="round" />
      <path d="M 72,70 Q 85,48 98,70" fill="none" stroke="#00FF66" strokeWidth="5" strokeLinecap="round" />
      <path d="M 62,82 Q 70,94 78,82 Z" fill="#00FF66" />
    </g>
    <text x="70" y="145" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Excited</text>
  </g>

  <!-- Row 2 -->
  <!-- 4. Analyzing -->
  <g transform="translate(40, 240)">
    <circle cx="70" cy="70" r="55" fill="url(#miniFace)" stroke="#1e293b" strokeWidth="2" />
    <g filter="url(#exprAeroGlow)">
      <line x1="42" y1="68" x2="68" y2="68" stroke="#00FF66" strokeWidth="4" strokeLinecap="round" />
      <line x1="72" y1="68" x2="98" y2="68" stroke="#00FF66" strokeWidth="4" strokeLinecap="round" />
      <circle cx="55" cy="68" r="2.5" fill="#ffffff" />
      <circle cx="85" cy="68" r="2.5" fill="#ffffff" />
      <rect x="38" y="58" width="64" height="20" rx="3" fill="none" stroke="#00FF66" strokeWidth="1" strokeDasharray="4 2" opacity="0.6" />
    </g>
    <text x="70" y="145" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Analyzing</text>
  </g>

  <!-- 5. Confused -->
  <g transform="translate(230, 240)">
    <circle cx="70" cy="70" r="55" fill="url(#miniFace)" stroke="#1e293b" strokeWidth="2" />
    <g filter="url(#exprAeroGlow)">
      <circle cx="52" cy="68" r="6" fill="#00FF66" />
      <path d="M 76,72 Q 86,60 96,72" fill="none" stroke="#00FF66" strokeWidth="4.5" strokeLinecap="round" />
      <path d="M 64,84 Q 70,80 76,86" fill="none" stroke="#00FF66" strokeWidth="2.5" strokeLinecap="round" />
    </g>
    <text x="70" y="145" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Confused</text>
  </g>

  <!-- 6. Winking -->
  <g transform="translate(420, 240)">
    <circle cx="70" cy="70" r="55" fill="url(#miniFace)" stroke="#1e293b" strokeWidth="2" />
    <g filter="url(#exprAeroGlow)">
      <path d="M 45,70 Q 55,54 65,70" fill="none" stroke="#00FF66" strokeWidth="4.5" strokeLinecap="round" />
      <path d="M 76,64 L 86,72 L 96,64" fill="none" stroke="#00FF66" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round" />
      <path d="M 64,84 Q 70,89 76,84" fill="none" stroke="#00FF66" strokeWidth="2.5" strokeLinecap="round" />
    </g>
    <text x="70" y="145" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Winking</text>
  </g>

  <!-- Row 3 -->
  <!-- 7. Loading -->
  <g transform="translate(40, 410)">
    <circle cx="70" cy="70" r="55" fill="url(#miniFace)" stroke="#1e293b" strokeWidth="2" />
    <g filter="url(#exprAeroGlow)">
      <circle cx="55" cy="68" r="8" fill="none" stroke="#00FF66" strokeWidth="3" strokeDasharray="25 10" />
      <circle cx="85" cy="68" r="8" fill="none" stroke="#00FF66" strokeWidth="3" strokeDasharray="25 10" />
      <circle cx="55" cy="68" r="2.5" fill="#00FF66" />
      <circle cx="85" cy="68" r="2.5" fill="#00FF66" />
    </g>
    <text x="70" y="145" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Loading</text>
  </g>

  <!-- 8. Surprised -->
  <g transform="translate(230, 410)">
    <circle cx="70" cy="70" r="55" fill="url(#miniFace)" stroke="#1e293b" strokeWidth="2" />
    <g filter="url(#exprAeroGlow)">
      <circle cx="52" cy="66" r="9" fill="none" stroke="#00FF66" strokeWidth="4" />
      <circle cx="52" cy="66" r="3.5" fill="#00FF66" />
      <circle cx="88" cy="66" r="9" fill="none" stroke="#00FF66" strokeWidth="4" />
      <circle cx="88" cy="66" r="3.5" fill="#00FF66" />
      <circle cx="70" cy="85" r="4" fill="#00FF66" />
    </g>
    <text x="70" y="145" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Surprised</text>
  </g>

  <!-- 9. Sleep -->
  <g transform="translate(420, 410)">
    <circle cx="70" cy="70" r="55" fill="url(#miniFace)" stroke="#1e293b" strokeWidth="2" />
    <g filter="url(#exprAeroGlow)">
      <line x1="45" y1="68" x2="65" y2="68" stroke="#00FF66" strokeWidth="4" strokeLinecap="round" />
      <line x1="75" y1="68" x2="95" y2="68" stroke="#00FF66" strokeWidth="4" strokeLinecap="round" />
      <text x="96" y="55" fill="#00FF66" fontSize="10" fontFamily="monospace" fontWeight="bold">z</text>
      <text x="104" y="47" fill="#00FF66" fontSize="8" fontFamily="monospace" fontWeight="bold">z</text>
    </g>
    <text x="70" y="145" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Sleep</text>
  </g>
</svg>
