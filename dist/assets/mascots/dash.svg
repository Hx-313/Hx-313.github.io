<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background & Glow Filters -->
    <filter id="dashNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="dashSubtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Shading Gradients -->
    <linearGradient id="dashWhiteArmor" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="60%" stopColor="#e2e8f0" />
      <stop offset="100%" stopColor="#cbd5e1" />
    </linearGradient>

    <linearGradient id="dashDarkArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e293b" />
      <stop offset="70%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>

    <radialGradient id="dashScreenGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#080e1a" />
      <stop offset="85%" stopColor="#020617" />
      <stop offset="100%" stopColor="#000000" />
    </radialGradient>

    <linearGradient id="dashThrusterJet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="30%" stopColor="#00FF66" />
      <stop offset="80%" stopColor="#10b981" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#047857" stopOpacity="0" />
    </linearGradient>
  </defs>

  <!-- Jet Thruster Energy Streams (Flight & Movement) -->
  <g filter="url(#dashNeonGlow)">
    <!-- Left Wing Thruster Exhaust -->
    <path d="M 68,225 Q 25,265 15,315 Q 45,290 76,245 Z" fill="url(#dashThrusterJet)" opacity="0.9" />
    <!-- Right Wing Thruster Exhaust -->
    <path d="M 252,225 Q 295,265 305,315 Q 275,290 244,245 Z" fill="url(#dashThrusterJet)" opacity="0.9" />
    <!-- Foot Thrusters Exhaust -->
    <path d="M 128,300 Q 120,345 110,360 Q 135,340 138,300 Z" fill="url(#dashThrusterJet)" opacity="0.85" />
    <path d="M 192,300 Q 200,345 210,360 Q 185,340 182,300 Z" fill="url(#dashThrusterJet)" opacity="0.85" />
  </g>

  <!-- Wing Thruster Pods (Rear) -->
  <g>
    <!-- Left Wing Fin -->
    <path d="M 95,185 L 45,200 Q 35,215 50,225 L 90,210 Z" fill="url(#dashDarkArmor)" stroke="#334155" strokeWidth="2" />
    <polygon points="50,205 40,215 65,215 75,205" fill="#00FF66" filter="url(#dashNeonGlow)" />

    <!-- Right Wing Fin -->
    <path d="M 225,185 L 275,200 Q 285,215 270,225 L 230,210 Z" fill="url(#dashDarkArmor)" stroke="#334155" strokeWidth="2" />
    <polygon points="270,205 280,215 255,215 245,205" fill="#00FF66" filter="url(#dashNeonGlow)" />
  </g>

  <!-- Cyber Antennae (Signal Receivers) -->
  <!-- Left Antenna -->
  <g>
    <polygon points="98,110 65,30 125,90" fill="url(#dashDarkArmor)" stroke="#334155" strokeWidth="2.5" />
    <polygon points="92,95 72,45 110,85" fill="#00FF66" filter="url(#dashNeonGlow)" />
    <polygon points="90,92 76,52 105,84" fill="#ffffff" opacity="0.75" />
  </g>

  <!-- Right Antenna -->
  <g>
    <polygon points="222,110 255,30 195,90" fill="url(#dashDarkArmor)" stroke="#334155" strokeWidth="2.5" />
    <polygon points="228,95 248,45 210,85" fill="#00FF66" filter="url(#dashNeonGlow)" />
    <polygon points="230,92 244,52 215,84" fill="#ffffff" opacity="0.75" />
  </g>

  <!-- Helmet Chassis Body (Glossy White Armor) -->
  <rect x="80" y="85" width="160" height="135" rx="55" fill="url(#dashWhiteArmor)" stroke="#94a3b8" strokeWidth="3" />
  <!-- Helmet Top Highlight -->
  <path d="M 115,95 Q 160,88 205,95" stroke="#ffffff" strokeWidth="3.5" strokeLinecap="round" opacity="0.9" />

  <!-- Dark Glass Face Screen (Expression Engine) -->
  <rect x="98" y="105" width="124" height="96" rx="34" fill="url(#dashScreenGrad)" stroke="#1e293b" strokeWidth="2" />
  <path d="M 112,118 Q 160,110 208,118" stroke="#334155" strokeWidth="1.5" strokeLinecap="round" opacity="0.5" />

  <!-- Glowing LED Eyes (Happy Expression default: ^ ^) -->
  <g id="dashEyes" filter="url(#dashNeonGlow)">
    <path d="M 120,150 Q 135,130 150,150" fill="none" stroke="#00FF66" strokeWidth="6.5" strokeLinecap="round" />
    <path d="M 170,150 Q 185,130 200,150" fill="none" stroke="#00FF66" strokeWidth="6.5" strokeLinecap="round" />
    <path d="M 121,150 Q 135,132 149,150" fill="none" stroke="#ffffff" strokeWidth="2" strokeLinecap="round" opacity="0.9" />
    <path d="M 171,150 Q 185,132 199,150" fill="none" stroke="#ffffff" strokeWidth="2" strokeLinecap="round" opacity="0.9" />
  </g>

  <!-- Happy Mouth -->
  <g filter="url(#dashNeonGlow)">
    <path d="M 152,170 Q 160,178 168,170" fill="none" stroke="#00FF66" strokeWidth="3.5" strokeLinecap="round" />
  </g>

  <!-- Torso & Lower Body -->
  <g>
    <!-- Neck Connector -->
    <rect x="145" y="218" width="30" height="12" rx="4" fill="#0f172a" />
    <!-- Chest Armor -->
    <path d="M 120,230 L 200,230 L 188,285 L 132,285 Z" fill="url(#dashDarkArmor)" stroke="#334155" strokeWidth="2" />
    <path d="M 128,235 L 192,235 L 182,275 L 138,275 Z" fill="url(#dashWhiteArmor)" />

    <!-- HX313 Chest Logo -->
    <text x="160" y="260" text-anchor="middle" font-family="'JetBrains Mono', 'Outfit', sans-serif" font-size="11" font-weight="900" fill="#0f172a" letter-spacing="1">HX313</text>

    <!-- Robotic Arm Left (Gesturing / Pointing) -->
    <g>
      <circle cx="102" cy="240" r="12" fill="url(#dashWhiteArmor)" stroke="#94a3b8" strokeWidth="1.5" />
      <path d="M 98,245 L 72,225 Q 65,215 58,225 L 88,255 Z" fill="url(#dashDarkArmor)" />
      <!-- Pointing Finger / Glove -->
      <circle cx="62" cy="218" r="7" fill="#020617" />
      <path d="M 62,216 L 52,205" stroke="#020617" strokeWidth="4" strokeLinecap="round" />
    </g>

    <!-- Robotic Arm Right -->
    <g>
      <circle cx="218" cy="240" r="12" fill="url(#dashWhiteArmor)" stroke="#94a3b8" strokeWidth="1.5" />
      <path d="M 222,245 L 248,258 Q 258,265 252,275 L 228,258 Z" fill="url(#dashDarkArmor)" />
      <circle cx="254" cy="270" r="7" fill="#020617" />
    </g>

    <!-- Legs / Thruster Boots -->
    <rect x="134" y="285" width="18" height="24" rx="6" fill="url(#dashWhiteArmor)" stroke="#94a3b8" strokeWidth="1.5" />
    <rect x="168" y="285" width="18" height="24" rx="6" fill="url(#dashWhiteArmor)" stroke="#94a3b8" strokeWidth="1.5" />
    <ellipse cx="143" cy="308" rx="8" ry="4" fill="#00FF66" filter="url(#dashNeonGlow)" />
    <ellipse cx="177" cy="308" rx="8" ry="4" fill="#00FF66" filter="url(#dashNeonGlow)" />
  </g>
</svg>
