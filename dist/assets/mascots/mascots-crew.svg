<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background / Glow Filters -->
    <filter id="crewGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b1" />
      <feGaussianBlur stdDeviation="16" result="b2" />
      <feMerge>
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Radial Background Atmosphere -->
    <radialGradient id="bgAtmosphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#042f1e" stopOpacity="0.4" />
      <stop offset="60%" stopColor="#02140d" stopOpacity="0.1" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0" />
    </radialGradient>

    <!-- Gradients for Aero -->
    <radialGradient id="aeroSphere" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stopColor="#475569" />
      <stop offset="35%" stopColor="#1e293b" />
      <stop offset="75%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#020617" />
    </radialGradient>
    <radialGradient id="aeroHighlightCrew" cx="30%" cy="25%" r="45%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.45" />
      <stop offset="40%" stopColor="#94a3b8" stopOpacity="0.15" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0" />
    </radialGradient>

    <!-- Gradients for Dash -->
    <linearGradient id="dashWhite" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="60%" stopColor="#e2e8f0" />
      <stop offset="100%" stopColor="#cbd5e1" />
    </linearGradient>
    <linearGradient id="dashDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e293b" />
      <stop offset="70%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>
    <linearGradient id="jetTrail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="30%" stopColor="#00FF66" />
      <stop offset="80%" stopColor="#10b981" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#047857" stopOpacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Cyber Particle Aura -->
  <rect x="0" y="0" width="720" height="480" fill="url(#bgAtmosphere)" />

  <!-- Particle Dots -->
  <g fill="#00FF66" opacity="0.4" filter="url(#crewGlow)">
    <circle cx="120" cy="80" r="2" />
    <circle cx="340" cy="60" r="1.5" />
    <circle cx="620" cy="140" r="2" />
    <circle cx="210" cy="410" r="2.5" />
    <circle cx="560" cy="380" r="2" />
    <circle cx="80" cy="290" r="1.5" />
  </g>

  <!-- ==================== LEFT: AERO (AI ASSISTANT) ==================== -->
  <g transform="translate(40, 20)">
    <!-- Lower Floating Energy Rings -->
    <g opacity="0.8" filter="url(#crewGlow)">
      <ellipse cx="200" cy="350" rx="76" ry="18" stroke="#00FF66" strokeWidth="2.5" strokeDasharray="20 8" opacity="0.6" />
      <ellipse cx="200" cy="368" rx="52" ry="12" stroke="#22c55e" strokeWidth="2" opacity="0.8" />
    </g>

    <!-- Thruster Leaves underneath -->
    <g filter="url(#crewGlow)">
      <path d="M 160,295 Q 138,335 168,350 Q 180,320 170,295 Z" fill="#00FF66" opacity="0.9" />
      <path d="M 240,295 Q 262,335 232,350 Q 220,320 230,295 Z" fill="#00FF66" opacity="0.9" />
      <ellipse cx="200" cy="302" rx="22" ry="7" fill="#00FF66" opacity="0.95" />
    </g>

    <!-- Floating Green Halo Ring -->
    <g transform="translate(0, -14)" filter="url(#crewGlow)">
      <ellipse cx="200" cy="80" rx="80" ry="22" fill="none" stroke="#00FF66" strokeWidth="7" />
      <ellipse cx="200" cy="80" rx="80" ry="22" fill="none" stroke="#ffffff" strokeWidth="1.5" opacity="0.85" />
    </g>

    <!-- Left Ear Pod with Wing -->
    <g>
      <path d="M 82,165 Q 42,125 58,198 Q 82,180 82,165 Z" fill="#00FF66" opacity="0.85" filter="url(#crewGlow)" />
      <rect x="70" y="165" width="20" height="55" rx="10" fill="#047857" stroke="#00FF66" strokeWidth="1.5" />
      <circle cx="80" cy="192" r="22" fill="#0b1320" stroke="#00FF66" strokeWidth="3" />
      <circle cx="80" cy="192" r="6" fill="#00FF66" filter="url(#crewGlow)" />
    </g>

    <!-- Right Ear Pod with Wing -->
    <g>
      <path d="M 318,165 Q 358,125 342,198 Q 318,180 318,165 Z" fill="#00FF66" opacity="0.85" filter="url(#crewGlow)" />
      <rect x="310" y="165" width="20" height="55" rx="10" fill="#047857" stroke="#00FF66" strokeWidth="1.5" />
      <circle cx="320" cy="192" r="22" fill="#0b1320" stroke="#00FF66" strokeWidth="3" />
      <circle cx="320" cy="192" r="6" fill="#00FF66" filter="url(#crewGlow)" />
    </g>

    <!-- Main Core Sphere Body -->
    <circle cx="200" cy="198" r="105" fill="url(#aeroSphere)" stroke="#334155" strokeWidth="4" />
    <circle cx="200" cy="198" r="105" fill="url(#aeroHighlightCrew)" />

    <!-- Dark Glass Face Screen -->
    <ellipse cx="200" cy="195" rx="80" ry="60" fill="#020617" stroke="#1e293b" strokeWidth="2.5" />
    <path d="M 142,160 Q 200,144 258,160" stroke="#475569" strokeWidth="2.5" strokeLinecap="round" opacity="0.4" fill="none" />

    <!-- Glowing LED Eyes (Happy ^ ^) -->
    <g filter="url(#crewGlow)">
      <path d="M 160,195 Q 178,170 195,195" fill="none" stroke="#00FF66" strokeWidth="7" strokeLinecap="round" />
      <path d="M 205,195 Q 222,170 240,195" fill="none" stroke="#00FF66" strokeWidth="7" strokeLinecap="round" />
      <path d="M 162,195 Q 178,172 194,195" fill="none" stroke="#ffffff" strokeWidth="2.5" strokeLinecap="round" opacity="0.9" />
      <path d="M 206,195 Q 222,172 238,195" fill="none" stroke="#ffffff" strokeWidth="2.5" strokeLinecap="round" opacity="0.9" />
      <!-- Smile -->
      <path d="M 191,218 Q 200,226 209,218" fill="none" stroke="#00FF66" strokeWidth="4" strokeLinecap="round" />
    </g>

    <!-- Hx313 Chin Branding -->
    <text x="200" y="278" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#94a3b8" letter-spacing="2">Hx313</text>
  </g>

  <!-- ==================== RIGHT: DASH (SYSTEM DRONE) ==================== -->
  <g transform="translate(390, 45) rotate(4, 150, 160)">
    <!-- Jet Thrusters Flame Exhaust -->
    <g filter="url(#crewGlow)">
      <path d="M 60,210 Q 15,250 5,300 Q 35,275 68,230 Z" fill="url(#jetTrail)" opacity="0.9" />
      <path d="M 240,210 Q 285,250 295,300 Q 265,275 232,230 Z" fill="url(#jetTrail)" opacity="0.9" />
      <path d="M 120,285 Q 110,330 100,345 Q 125,325 130,285 Z" fill="url(#jetTrail)" opacity="0.85" />
      <path d="M 180,285 Q 190,330 200,345 Q 175,325 170,285 Z" fill="url(#jetTrail)" opacity="0.85" />
    </g>

    <!-- Thruster Wings on Shoulders -->
    <g>
      <path d="M 85,170 L 35,185 Q 25,200 40,210 L 80,195 Z" fill="url(#dashDark)" stroke="#334155" strokeWidth="2" />
      <polygon points="40,190 30,200 55,200 65,190" fill="#00FF66" filter="url(#crewGlow)" />
      <path d="M 215,170 L 265,185 Q 275,200 260,210 L 220,195 Z" fill="url(#dashDark)" stroke="#334155" strokeWidth="2" />
      <polygon points="260,190 270,200 245,200 235,190" fill="#00FF66" filter="url(#crewGlow)" />
    </g>

    <!-- Pointed Cyber Antennae -->
    <g>
      <polygon points="90,95 55,15 115,75" fill="url(#dashDark)" stroke="#334155" strokeWidth="2.5" />
      <polygon points="84,80 62,30 100,70" fill="#00FF66" filter="url(#crewGlow)" />
      <polygon points="210,95 245,15 185,75" fill="url(#dashDark)" stroke="#334155" strokeWidth="2.5" />
      <polygon points="216,80 238,30 200,70" fill="#00FF66" filter="url(#crewGlow)" />
    </g>

    <!-- White Glossy Helmet -->
    <rect x="75" y="70" width="150" height="125" rx="50" fill="url(#dashWhite)" stroke="#94a3b8" strokeWidth="3" />
    <path d="M 105,80 Q 150,72 195,80" stroke="#ffffff" strokeWidth="3.5" strokeLinecap="round" opacity="0.9" />

    <!-- Dark Face Screen Visor -->
    <rect x="90" y="90" width="120" height="90" rx="32" fill="#020617" stroke="#1e293b" strokeWidth="2" />

    <!-- Glowing LED Eyes (Happy Smiling) -->
    <g filter="url(#crewGlow)">
      <path d="M 112,130 Q 126,112 140,130" fill="none" stroke="#00FF66" strokeWidth="6.5" strokeLinecap="round" />
      <path d="M 160,130 Q 174,112 188,130" fill="none" stroke="#00FF66" strokeWidth="6.5" strokeLinecap="round" />
      <path d="M 113,130 Q 126,114 139,130" fill="none" stroke="#ffffff" strokeWidth="2" strokeLinecap="round" opacity="0.9" />
      <path d="M 161,130 Q 174,114 187,130" fill="none" stroke="#ffffff" strokeWidth="2" strokeLinecap="round" opacity="0.9" />
      <!-- Mouth -->
      <path d="M 144,148 Q 150,156 156,148" fill="none" stroke="#00FF66" strokeWidth="3.5" strokeLinecap="round" />
    </g>

    <!-- Torso & Arms -->
    <g>
      <rect x="135" y="195" width="30" height="10" rx="4" fill="#0f172a" />
      <path d="M 110,205 L 190,205 L 180,255 L 120,255 Z" fill="url(#dashDark)" stroke="#334155" strokeWidth="2" />
      <path d="M 118,210 L 182,210 L 174,248 L 126,248 Z" fill="url(#dashWhite)" />
      <!-- Logo -->
      <text x="150" y="233" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" fill="#0f172a">HX313</text>

      <!-- Pointing Left Arm (gesturing towards user/Aero) -->
      <circle cx="95" cy="215" r="11" fill="url(#dashWhite)" stroke="#94a3b8" strokeWidth="1.5" />
      <path d="M 90,220 L 65,200 Q 58,190 52,200 L 80,230 Z" fill="url(#dashDark)" />
      <circle cx="56" cy="194" r="6" fill="#020617" />
      <path d="M 56,192 L 46,180" stroke="#020617" strokeWidth="3.5" strokeLinecap="round" />

      <!-- Right Arm -->
      <circle cx="205" cy="215" r="11" fill="url(#dashWhite)" stroke="#94a3b8" strokeWidth="1.5" />
      <path d="M 210,220 L 235,232 Q 245,238 240,248 L 215,232 Z" fill="url(#dashDark)" />
      <circle cx="240" cy="245" r="6" fill="#020617" />

      <!-- Legs -->
      <rect x="125" y="255" width="16" height="22" rx="5" fill="url(#dashWhite)" stroke="#94a3b8" strokeWidth="1.5" />
      <rect x="158" y="255" width="16" height="22" rx="5" fill="url(#dashWhite)" stroke="#94a3b8" strokeWidth="1.5" />
      <ellipse cx="133" cy="276" rx="7" ry="3.5" fill="#00FF66" filter="url(#crewGlow)" />
      <ellipse cx="166" cy="276" rx="7" ry="3.5" fill="#00FF66" filter="url(#crewGlow)" />
    </g>
  </g>
</svg>
