    <script>
      (() => {
        try {
          const theme = window.localStorage.getItem('portfolio-theme');
          if (theme === 'light' || theme === 'dark' || theme === 'system') {
            document.documentElement.dataset.theme = theme;
          }
        } catch {
          // Storage can be unavailable; the dark default remains valid.
        }
      })();
    </script>
