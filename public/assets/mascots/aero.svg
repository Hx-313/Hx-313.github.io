<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background / Glow Filters -->
    <filter id="aeroNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="aeroSubtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Chrome / Glass Metallic Gradients -->
    <radialGradient id="aeroSphereGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stopColor="#475569" />
      <stop offset="35%" stopColor="#1e293b" />
      <stop offset="75%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#020617" />
    </radialGradient>

    <radialGradient id="aeroHighlight" cx="30%" cy="25%" r="45%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.45" />
      <stop offset="40%" stopColor="#94a3b8" stopOpacity="0.15" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0" />
    </radialGradient>

    <linearGradient id="aeroHaloGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#00FF66" />
      <stop offset="50%" stopColor="#22c55e" />
      <stop offset="100%" stopColor="#10b981" />
    </linearGradient>

    <linearGradient id="aeroPodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#10b981" />
      <stop offset="100%" stopColor="#047857" />
    </linearGradient>

    <radialGradient id="aeroFaceGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stopColor="#0a0f1d" />
      <stop offset="85%" stopColor="#020617" />
      <stop offset="100%" stopColor="#000000" />
    </radialGradient>
  </defs>

  <!-- Lower Floating Energy Rings -->
  <g opacity="0.85" filter="url(#aeroNeonGlow)">
    <ellipse cx="160" cy="310" rx="70" ry="16" stroke="#00FF66" strokeWidth="2.5" strokeDasharray="18 6" opacity="0.6" />
    <ellipse cx="160" cy="326" rx="48" ry="11" stroke="#22c55e" strokeWidth="2" opacity="0.8" />
  </g>

  <!-- Floating Thruster Energy Leaves (under orb) -->
  <g filter="url(#aeroNeonGlow)">
    <path d="M 125,260 Q 105,295 132,310 Q 142,285 133,260 Z" fill="#00FF66" opacity="0.9" />
    <path d="M 195,260 Q 215,295 188,310 Q 178,285 187,260 Z" fill="#00FF66" opacity="0.9" />
    <ellipse cx="160" cy="265" rx="20" ry="6" fill="#00FF66" opacity="0.95" />
  </g>

  <!-- Floating Green Halo Ring (Thinking Indicator) -->
  <g transform="translate(0, -10)" filter="url(#aeroNeonGlow)">
    <ellipse cx="160" cy="68" rx="72" ry="20" fill="none" stroke="url(#aeroHaloGrad)" strokeWidth="6.5" />
    <ellipse cx="160" cy="68" rx="72" ry="20" fill="none" stroke="#ffffff" strokeWidth="1.5" opacity="0.85" />
  </g>

  <!-- Side Ear Pods with Leaf Fin Wings -->
  <!-- Left Ear Pod -->
  <g filter="url(#aeroSubtleGlow)">
    <!-- Leaf Fin Wing -->
    <path d="M 52,145 Q 18,110 32,175 Q 52,160 52,145 Z" fill="#00FF66" opacity="0.85" filter="url(#aeroNeonGlow)" />
    <!-- Pod Mount -->
    <rect x="42" y="145" width="18" height="50" rx="9" fill="url(#aeroPodGrad)" stroke="#00FF66" strokeWidth="1.5" />
    <circle cx="51" cy="170" r="20" fill="#0b1320" stroke="#00FF66" strokeWidth="3" />
    <circle cx="51" cy="170" r="10" fill="#047857" />
    <circle cx="51" cy="170" r="5" fill="#00FF66" filter="url(#aeroNeonGlow)" />
  </g>

  <!-- Right Ear Pod -->
  <g filter="url(#aeroSubtleGlow)">
    <!-- Leaf Fin Wing -->
    <path d="M 268,145 Q 302,110 288,175 Q 268,160 268,145 Z" fill="#00FF66" opacity="0.85" filter="url(#aeroNeonGlow)" />
    <!-- Pod Mount -->
    <rect x="260" y="145" width="18" height="50" rx="9" fill="url(#aeroPodGrad)" stroke="#00FF66" strokeWidth="1.5" />
    <circle cx="269" cy="170" r="20" fill="#0b1320" stroke="#00FF66" strokeWidth="3" />
    <circle cx="269" cy="170" r="10" fill="#047857" />
    <circle cx="269" cy="170" r="5" fill="#00FF66" filter="url(#aeroNeonGlow)" />
  </g>

  <!-- Main Spherical Core Body -->
  <circle cx="160" cy="175" r="95" fill="url(#aeroSphereGrad)" stroke="#334155" strokeWidth="3.5" />
  <circle cx="160" cy="175" r="95" fill="url(#aeroHighlight)" />

  <!-- Dark Glass Face Screen (Emotion Engine) -->
  <ellipse cx="160" cy="172" rx="72" ry="54" fill="url(#aeroFaceGrad)" stroke="#1e293b" strokeWidth="2.5" />
  <!-- Glass Reflection Arc -->
  <path d="M 108,140 Q 160,126 212,140" stroke="#475569" strokeWidth="2" strokeLinecap="round" opacity="0.4" fill="none" />

  <!-- Glowing LED Eyes (Happy Expression default: ^ ^) -->
  <g id="aeroEyes" filter="url(#aeroNeonGlow)">
    <path d="M 125,172 Q 140,150 155,172" fill="none" stroke="#00FF66" strokeWidth="6.5" strokeLinecap="round" />
    <path d="M 165,172 Q 180,150 195,172" fill="none" stroke="#00FF66" strokeWidth="6.5" strokeLinecap="round" />
    <!-- Core white line for intense OLED phosphor feel -->
    <path d="M 126,172 Q 140,152 154,172" fill="none" stroke="#ffffff" strokeWidth="2" strokeLinecap="round" opacity="0.9" />
    <path d="M 166,172 Q 180,152 194,172" fill="none" stroke="#ffffff" strokeWidth="2" strokeLinecap="round" opacity="0.9" />
  </g>

  <!-- Cute Smile Mouth -->
  <g filter="url(#aeroNeonGlow)">
    <path d="M 152,192 Q 160,199 168,192" fill="none" stroke="#00FF66" strokeWidth="3.5" strokeLinecap="round" />
  </g>

  <!-- Hx313 Branding on Lower Chin -->
  <g transform="translate(160, 245)">
    <text x="0" y="0" text-anchor="middle" font-family="'JetBrains Mono', 'Outfit', sans-serif" font-size="12" font-weight="800" fill="#94a3b8" letter-spacing="2">Hx313</text>
  </g>
</svg>
